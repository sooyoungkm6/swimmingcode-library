<div class="sc-lib" id="sc-lib">

<style>
.sc-lib{
  --navy-900:#050d24; --navy-800:#0a1736; --navy-700:#102553;
  --navy-600:#1a3a85; --navy-500:#2855c2; --navy-100:#e3eaff;
  --lime-500:#5de84e; --lime-400:#7ef064; --lime-200:#c5f7bc; --lime-on:#052612;
  --paper:#f7f8fb; --paper-2:#eef0f6; --paper-3:#e4e7f0;
  --ink-900:#0c1020; --ink-700:#2a3046; --ink-500:#5a6079; --ink-300:#aab0c4;
  --line:rgba(16,37,83,0.10);
  --r-sm:4px; --r-md:8px; --r-lg:12px; --r-xl:18px; --r-2xl:24px;
  --shadow-amb:0 1px 0 rgba(16,37,83,0.04), 0 8px 28px rgba(16,37,83,0.06);
  --shadow-float:0 1px 0 rgba(16,37,83,0.05), 0 24px 60px rgba(16,37,83,0.10);
  --font-display:'Manrope','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'Pretendard','Manrope',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;

  --ground:var(--paper); --surface:#ffffff; --surface-2:var(--paper-2);
  --edge:var(--paper-3); --fg:var(--ink-900); --fg-2:var(--ink-700); --fg-3:var(--ink-500);
  --accent:var(--lime-500); --accent-on:var(--lime-on);

  --sc-max:1120px; --sc-gap-sec:56px; --sc-gap-card:20px; --sc-pad-card:24px;

  max-width:var(--sc-max); margin:0 auto; padding:0 20px;
  background:transparent; color:var(--fg);
  font-family:var(--font-body); font-size:16px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.sc-lib[data-theme="dark"]{
  background:var(--ground); padding-top:1px; padding-bottom:24px;
  --ground:#040a1a; --surface:#0a1430; --surface-2:#0e1a3c;
  --edge:#1a2952; --fg:#eef2fb; --fg-2:#c3cde6; --fg-3:#8f9dc0;
  --accent:var(--lime-400);
  --shadow-amb:0 1px 2px rgba(0,0,0,.40), 0 8px 24px rgba(0,0,0,.35);
}

.sc-lib *, .sc-lib *::before, .sc-lib *::after{box-sizing:border-box}
.sc-lib h1, .sc-lib h2, .sc-lib h3, .sc-lib p{margin:0}
.sc-lib a{text-decoration:none; color:inherit}
.sc-lib img{display:block; max-width:100%; height:auto}
.sc-lib button, .sc-lib input{font:inherit; margin:0; color:inherit}

.sc-lib .sc-hero{
  background:var(--navy-900); color:#fff; border-radius:var(--r-2xl);
  padding:72px 64px;
  background-image:
    repeating-linear-gradient(90deg, rgba(126,240,100,0.06) 0 1px, transparent 1px 64px),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 64px);
  display:flex; align-items:flex-start; justify-content:space-between; gap:32px;
}
.sc-lib .sc-hero-body{max-width:56ch}
.sc-lib .sc-hero .sc-tag{
  font-family:var(--font-mono); font-size:11px; letter-spacing:0.14em;
  color:var(--lime-400); display:inline-flex; align-items:center; gap:8px;
  text-transform:uppercase;
}
.sc-lib .sc-hero .sc-tag::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--lime-400)}
.sc-lib .sc-hero h1{
  font-family:var(--font-display); font-weight:800;
  font-size:clamp(30px,4.2vw,44px); letter-spacing:-0.022em;
  color:#fff; margin:16px 0 12px; line-height:1.2;
}
.sc-lib .sc-hero p{color:rgba(255,255,255,0.72); font-size:15.5px}
.sc-lib .sc-logo{flex:0 0 auto; height:30px; width:auto; opacity:.95}

.sc-lib .sc-tools{
  display:flex; flex-direction:column; gap:14px;
  margin:-28px 24px 0; position:relative; z-index:2;
}
.sc-lib .sc-search{
  display:flex; align-items:center; gap:10px;
  background:var(--surface); border:1px solid var(--edge);
  border-radius:var(--r-lg); padding:16px 20px; box-shadow:var(--shadow-amb);
}
.sc-lib .sc-search svg{flex:0 0 auto; color:var(--fg-3)}
.sc-lib .sc-search input{
  flex:1; min-width:0; border:0; outline:0; background:transparent;
  font-family:var(--font-body); font-size:15px; color:var(--fg);
}
.sc-lib .sc-search input::placeholder{color:var(--ink-300)}
.sc-lib .sc-search:focus-within{border-color:var(--navy-700); box-shadow:0 0 0 4px rgba(40,85,194,0.10)}

.sc-lib .sc-chips{display:flex; flex-wrap:wrap; gap:8px}
.sc-lib .sc-chip{
  font-family:var(--font-body); font-size:13px; font-weight:500;
  padding:8px 15px; border-radius:999px; cursor:pointer;
  background:var(--surface); color:var(--fg-2); border:1px solid var(--edge);
  transition:background .14s, color .14s, border-color .14s;
}
.sc-lib .sc-chip:hover{border-color:var(--fg-3)}
.sc-lib .sc-chip:focus-visible{outline:2px solid var(--navy-600); outline-offset:2px}
.sc-lib .sc-chip[aria-pressed="true"]{
  background:var(--accent); color:var(--accent-on);
  border-color:var(--accent); font-weight:700;
}
.sc-lib .sc-count{font-family:var(--font-mono); font-size:12px; color:var(--fg-3)}

.sc-lib .sc-main{padding:var(--sc-gap-sec) 0 0}
.sc-lib .sc-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--sc-gap-card)}

.sc-lib .sc-card{
  display:flex; flex-direction:column; gap:10px; min-width:0; overflow:hidden;
  background:var(--surface); border:1px solid var(--edge);
  border-radius:var(--r-lg); padding:var(--sc-pad-card);
  transition:box-shadow .16s ease, transform .16s ease, border-color .16s ease;
}
.sc-lib .sc-card:hover{box-shadow:var(--shadow-amb); transform:translateY(-2px); border-color:var(--accent)}
.sc-lib .sc-card:focus-visible{outline:2px solid var(--navy-600); outline-offset:3px}

.sc-lib .sc-thumb{
  display:block; position:relative; width:calc(100% + var(--sc-pad-card) * 2);
  margin:calc(var(--sc-pad-card) * -1) calc(var(--sc-pad-card) * -1) 4px;
  padding-top:125%; overflow:hidden;
  border-radius:var(--r-lg) var(--r-lg) 0 0;
  background:var(--surface-2);
}
.sc-lib .sc-thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.sc-lib .sc-thumb-fb{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:11px; letter-spacing:0.14em;
  color:var(--ink-300); text-transform:uppercase;
}

.sc-lib .sc-eyebrow{
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.14em;
  color:var(--navy-600); text-transform:uppercase;
}
.sc-lib[data-theme="dark"] .sc-eyebrow{color:var(--lime-400)}
.sc-lib .sc-card-t{
  font-family:var(--font-display); font-weight:700; font-size:17px;
  line-height:1.5; letter-spacing:-0.01em; color:var(--fg);
}
.sc-lib .sc-card-d{font-size:13.5px; line-height:1.65; color:var(--fg-3)}

.sc-lib .sc-tags{display:flex; flex-wrap:wrap; gap:6px}
.sc-lib .sc-tag-chip{
  display:inline-block; padding:3px 9px; border-radius:999px;
  background:var(--surface-2); color:var(--fg-2);
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.06em;
}

.sc-lib .sc-meta{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin-top:auto; padding-top:12px; border-top:1px solid var(--edge);
  font-family:var(--font-mono); font-size:11px; color:var(--fg-3);
  font-variant-numeric:tabular-nums;
}
.sc-lib .sc-go{color:var(--fg-2); font-weight:500}
.sc-lib .sc-card:hover .sc-go{color:var(--fg)}

.sc-lib .sc-empty{
  grid-column:1/-1; padding:48px 20px; text-align:center;
  color:var(--fg-3); font-size:14px;
  border:1px dashed var(--edge); border-radius:var(--r-lg);
}

.sc-lib .sc-footer{
  margin-top:var(--sc-gap-sec); padding:28px 0 8px;
  border-top:1px solid var(--edge);
  font-family:var(--font-mono); font-size:11.5px; color:var(--fg-3);
  display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center;
}
.sc-lib .sc-footer a{color:var(--fg-2); border-bottom:1px solid var(--edge)}
.sc-lib .sc-footer a:hover{color:var(--fg); border-color:var(--accent)}

@media (max-width:1024px){
  .sc-lib .sc-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:860px){
  .sc-lib .sc-hero{padding:48px 32px; flex-direction:column; align-items:flex-start; gap:24px}
  .sc-lib .sc-hero h1{font-size:clamp(26px,6vw,34px)}
  .sc-lib .sc-logo{order:2}
}
@media (max-width:640px){
  .sc-lib{padding:0 20px; --sc-gap-sec:40px; --sc-pad-card:20px}
  .sc-lib .sc-hero{padding:40px 24px}
  .sc-lib .sc-tools{margin:-24px 0 0}
  .sc-lib .sc-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .sc-lib *{transition:none !important; animation:none !important}
  .sc-lib .sc-card:hover{transform:none}
}
</style>

  ];

  DATA.sort(function(a,b){ return a.dt < b.dt ? 1 : a.dt > b.dt ? -1 : 0; });

  var CATS = ["전체"], seen = {};
  DATA.forEach(function(d){ if(!seen[d.c]){ seen[d.c] = 1; CATS.push(d.c); } });

  var active = "전체", query = "";
  var grid = document.getElementById("sc-grid");
  var chips = document.getElementById("sc-chips");
  var countEl = document.getElementById("sc-count");

  CATS.forEach(function(c){
    var b = document.createElement("button");
    b.className = "sc-chip";
    b.type = "button";
    b.textContent = c === "전체"
      ? "전체 " + DATA.length
      : c + " " + DATA.filter(function(d){ return d.c === c; }).length;
    b.setAttribute("aria-pressed", String(c === active));
    b.addEventListener("click", function(){
      active = c;
      Array.prototype.forEach.call(chips.children, function(el, i){
        el.setAttribute("aria-pressed", String(CATS[i] === c));
      });
      render();
    });
    chips.appendChild(b);
  });

  document.getElementById("sc-q").addEventListener("input", function(e){
    query = e.target.value.trim().toLowerCase();
    render();
  });

  function md(s){ return s.slice(5).replace("-", "/"); }

  function render(){
    var rows = DATA.filter(function(d){
      var hay = (d.t + " " + d.d + " " + d.c + " " + (d.tags || []).join(" ")).toLowerCase();
      return (active === "전체" || d.c === active) && (!query || hay.indexOf(query) !== -1);
    });

    countEl.textContent = query
      ? "“" + query + "” 검색 결과 " + rows.length + "건"
      : rows.length + "건";

    grid.innerHTML = "";

    if (!rows.length){
      var e = document.createElement("div");
      e.className = "sc-empty";
      e.textContent = "찾는 자료가 없습니다. 다른 말로 검색해 보시거나 분류를 눌러보세요.";
      grid.appendChild(e);
      return;
    }

    rows.forEach(function(d){
      var a = document.createElement("a");
      a.className = "sc-card";
      a.href = d.u;
      a.target = "_blank";
      a.rel = "noopener";

      var thumb = document.createElement("span");
      thumb.className = "sc-thumb";
      if (d.th){
        var img = document.createElement("img");
        img.src = d.th;
        img.alt = "";
        img.width = 640;
        img.height = 800;
        img.loading = "lazy";
        img.decoding = "async";
        thumb.appendChild(img);
      } else {
        var fb = document.createElement("span");
        fb.className = "sc-thumb-fb";
        fb.textContent = d.c;
        thumb.appendChild(fb);
      }
      a.appendChild(thumb);

      var eb = document.createElement("span");
      eb.className = "sc-eyebrow";
      eb.textContent = d.c;
      a.appendChild(eb);

      var h = document.createElement("h3");
      h.className = "sc-card-t";
      h.textContent = d.t;
      a.appendChild(h);

      var p = document.createElement("p");
      p.className = "sc-card-d";
      p.textContent = d.d;
      a.appendChild(p);

      if (d.tags && d.tags.length){
        var tw = document.createElement("span");
        tw.className = "sc-tags";
        d.tags.forEach(function(t){
          var tc = document.createElement("span");
          tc.className = "sc-tag-chip";
          tc.textContent = t;
          tw.appendChild(tc);
        });
        a.appendChild(tw);
      }

      var meta = document.createElement("span");
      meta.className = "sc-meta";
      var left = document.createElement("span");
      left.textContent = md(d.dt);
      var right = document.createElement("span");
      right.className = "sc-go";
      right.textContent = "열기 →";
      meta.appendChild(left);
      meta.appendChild(right);
      a.appendChild(meta);

      grid.appendChild(a);
    });
  }

  render();
  document.getElementById("sc-stamp").textContent = "자료 " + DATA.length + "건";
})();
</script>
